name: 每日抓取 AIHOT 日报

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00（日报早 8 点发布）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 支持在 GitHub 页面手动触发

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: 安装依赖
        run: pip install -r crawler/requirements.txt

      - name: 运行爬虫
        run: python crawler/crawl.py

      - name: 提交数据变更
        run: |
          git config user.name "aihot-crawler[bot]"
          git config user.email "aihot-crawler[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变更"
          else
            git commit -m "data: 抓取 $(date -u +%Y-%m-%d) 日报数据"
            git push
          fi
